# Local development stack: `docker compose up -d` (reads variables from .env).
# Ports bind to 127.0.0.1 only, so nothing is reachable from your network.
# Host ports can be changed in .env (e.g. POSTGRES_HOST_PORT=5433 if you already run Postgres locally).
name: iconnook

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.56.1
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set in .env}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - 127.0.0.1:${MEILI_HOST_PORT:-7700}:7700
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:7700/health | grep -q available']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.1.3-alpine
    command: [valkey-server, --appendonly, 'yes']
    ports:
      - 127.0.0.1:${VALKEY_HOST_PORT:-6379}:6379
    volumes:
      - valkey-data:/data
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # S3-compatible object storage for local dev (production uses Cloudflare R2). See ADR 0003.
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    entrypoint: [/bin/sh, /etc/seaweedfs/start.sh]
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set in .env}
      S3_BUCKET: ${S3_BUCKET:?set in .env}
    ports:
      - 127.0.0.1:${S3_HOST_PORT:-8333}:8333
    volumes:
      - ./infra/seaweedfs/start.sh:/etc/seaweedfs/start.sh:ro
      - seaweedfs-data:/data
    healthcheck:
      test:
        [CMD-SHELL, 'test -f /tmp/bucket-ready && wget -q --spider http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  meili-data:
  valkey-data:
  seaweedfs-data:
